    <!-- Firebase SDK v10 (Modular via ESM CDN) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        getDocs,
        query,
        where,
        serverTimestamp,
        deleteDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // 🔑 استبدل هذه القيم بمفاتيح مشروعك من Firebase Console
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      // اجعلها متاحة globally لاستخدامها في كود Babel
      window.FB = {
        auth,
        db,
        googleProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged,
        collection,
        doc,
        setDoc,
        getDocs,
        query,
        where,
        serverTimestamp,
        deleteDoc,
      };

      window.dispatchEvent(new Event("firebase-ready"));
    </script>

      // ==== الساعة المباشرة ====
      function LiveClock() {
        const [now, setNow] = useState(new Date());
        useEffect(() => {
          const id = setInterval(() => setNow(new Date()), 1000);
          return () => clearInterval(id);
        }, []);
        return (
          <div className="card-gold bg-deen-dark/70 backdrop-blur rounded-2xl p-5 flex items-center gap-4">
            <span className="text-3xl text-deen-gold">🕒</span>
            <div>
              <p className="text-xs text-deen-cream/60">الوقت الحالي</p>
              <p className="text-2xl font-bold text-deen-gold tabular-nums">
                {now.toLocaleTimeString("ar-EG", {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                })}

              <p className="text-xs text-deen-cream/70">
                {now.toLocaleDateString("ar-EG", {
                  weekday: "long",
                  day: "numeric",
                  month: "long",
                })}
              </p>
            </div>

        );
      }

      // ==== الموقع ====
      function LocationCard({ onLocationChange }) {
        const [location, setLocation] = useState("جاري تحديد الموقع...");
        const [manual, setManual] = useState("");

        const updateLocation = (val) => {
          setLocation(val);
          if (onLocationChange) onLocationChange(val);
        };

        useEffect(() => {
          if (!navigator.geolocation) {
            updateLocation("الموقع غير مدعوم");
            return;
          }
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const { latitude, longitude } = pos.coords;
              try {
                const res = await fetch(
                  `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar`
                );
                const data = await res.json();
                const city =
                  data.address?.state ||
                  data.address?.city ||
                  data.address?.country ||
                  "غير معروف";
                const country = data.address?.country || "";
                updateLocation(`${city}${country ? " - " + country : ""}`);
              } catch {
                updateLocation(`${latitude.toFixed(2)}, ${longitude.toFixed(2)}`);
              }
            },
            () => updateLocation("تم رفض الوصول للموقع")
          );
        }, []);

        return (
          <div className="card-gold bg-deen-dark/70 backdrop-blur rounded-2xl p-5">
            <div className="flex items-center gap-3 mb-2">
              <span className="text-2xl text-deen-gold">📍</span>

              onBlur={() => manual && updateLocation(manual)}
              className="w-full px-3 py-2 rounded-lg bg-deen-green/40 border border-deen-gold/30 text-deen-cream placeholder:text-deen-cream/40 focus:outline-none focus:border-deen-gold"
            />
          </div>
        );
      }

      // ==== شبكة الأجزاء ====
      function JuzGrid({
        reservations,
        currentUserId,
        userCity,
        onReserve,
        onCancel,
      }) {
        const handleClick = (juz) => {
          const res = reservations[juz.number];
          if (res) {
            if (res.userId === currentUserId) {
              if (
                confirm(
                  `أنت حجزت هذا الجزء (${res.city}). هل تريد إلغاء الحجز؟`
                )
              ) {
                onCancel(juz.number);
              }
            } else {
              alert(
                `هذا الورد محجوز من قبل: ${res.userName}\nالمدينة: ${res.city}\nاختر ورداً آخر.`
              );
            }
          } else {
            if (confirm(`هل تريد حجز ${juz.name}؟`)) {
              onReserve(juz.number, userCity || "غير محدد");
            }
          }
        };

        return (
          <section className="my-8">
            <h2 className="text-2xl font-bold text-deen-gold mb-4 font-arabic">
              📖 الأوراد (30 جزءاً)
            </h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
              {juzData.map((juz) => {
                const res = reservations[juz.number];
                const mine = res && res.userId === currentUserId;
                return (
                  <div
                    key={juz.number}
                    onClick={() => handleClick(juz)}
                    className={`juz-card card-gold rounded-xl p-3 text-center ${
                      res ? "reserved" : "bg-deen-green/60"
                    } ${mine ? "!bg-deen-gold/20 !border-deen-gold" : ""}`}
                  >
                    <p className="text-2xl mb-1">{res ? "🔒" : "📗"}</p>
                    <p className="text-sm font-bold text-deen-gold">
                      {juz.name}
                    </p>
                    <p className="text-[10px] text-deen-cream/60 mt-1">
                      {juz.start} → {juz.end}
                    </p>
                    {res ? (
                      <p className="text-[10px] mt-2 text-red-300 truncate">
                        {mine ? "حجزك ✓" : `محجوز: ${res.userName}`}
                      </p>
                    ) : (
                      <p className="text-[10px] mt-2 text-green-300">
                        متاح ✓
                      </p>
                    )}

      // ==== التطبيق الرئيسي ====
      function App() {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [reservations, setReservations] = useState({});
        const [userCity, setUserCity] = useState("غير محدد");
        const [fbReady, setFbReady] = useState(false);

        const todayKey = new Date().toISOString().split("T")[0];

        useEffect(() => {
          if (window.FB) setFbReady(true);
          else {
            const handler = () => setFbReady(true);
            window.addEventListener("firebase-ready", handler);
            return () => window.removeEventListener("firebase-ready", handler);
          }
        }, []);

        useEffect(() => {
          if (!fbReady) return;
          const { auth, onAuthStateChanged } = window.FB;
          const unsub = onAuthStateChanged(auth, (u) => {
            setUser(u);
            setLoading(false);
          });
          return () => unsub();
        }, [fbReady]);

        const loadReservations = async () => {
          const { db, collection, getDocs, query, where } = window.FB;
          const q = query(
            collection(db, "reservations"),
            where("date", "==", todayKey)
          );
          const snap = await getDocs(q);
          const map = {};
          snap.forEach((d) => {
            const data = d.data();
            map[data.juzNumber] = data;
          });
          setReservations(map);
        };

        useEffect(() => {
          if (user && fbReady) loadReservations();
        }, [user, fbReady]);

        const handleLogin = async () => {
          const { auth, googleProvider, signInWithPopup } = window.FB;
          try {
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            alert("فشل تسجيل الدخول: " + err.message);
          }
        };

        const handleLogout = () => {
          const { auth, signOut } = window.FB;
          signOut(auth);
        };

        const handleReserve = async (juzNumber, city) => {
          if (!user) return alert("يجب تسجيل الدخول أولاً");
          if (reservations[juzNumber]) {
            alert("هذا الورد محجوز بالفعل، اختر ورداً آخر.");
            return;
          }
          const { db, doc, setDoc, serverTimestamp } = window.FB;
          const docId = `${todayKey}_${juzNumber}`;
          try {
            await setDoc(doc(db, "reservations", docId), {
              juzNumber,
              date: todayKey,
              userId: user.uid,
              userName: user.displayName || "مستخدم",
              userEmail: user.email,
              city: city || "غير محدد",
              createdAt: serverTimestamp(),
            });
            await loadReservations();
            alert(`✅ تم حجز الجزء ${juzNumber} بنجاح`);
          } catch (err) {
            alert("خطأ في الحجز: " + err.message);
          }
        };

        const handleCancel = async (juzNumber) => {
          const res = reservations[juzNumber];
          if (!res) return;
          if (res.userId !== user.uid) {
            alert("لا يمكنك إلغاء حجز شخص آخر");
            return;
          }
          const { db, doc, deleteDoc } = window.FB;
          await deleteDoc(doc(db, "reservations", `${todayKey}_${juzNumber}`));
          await loadReservations();
        };

        if (!fbReady || loading) {
          return (
            <div className="min-h-screen flex items-center justify-center text-deen-gold text-2xl">
              جارٍ التحميل...
            </div>
          );
        }

        if (!user) {
          return <Login onLogin={handleLogin} />;
        }

        return (
          <div className="stars-bg min-h-screen relative">
            <div className="relative z-10 container mx-auto px-4 py-6 max-w-6xl">
              <Header user={user} onLogout={handleLogout} />
              <div className="grid md:grid-cols-2 gap-4 my-6">
                <LiveClock />
                <LocationCard onLocationChange={setUserCity} />
              </div>
              <JuzGrid
                reservations={reservations}
                currentUserId={user.uid}
                userCity={userCity}
                onReserve={handleReserve}
                onCancel={handleCancel}
              />
              <DuasSection />
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
