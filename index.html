<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أوراد القرآن الكريم</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              deen: { dark: "#0b3d2e", green: "#145a3c", light: "#1e7a52", gold: "#f4c430", cream: "#fdf6e3" },
            },
            fontFamily: { arabic: ["'Amiri'", "'Cairo'", "serif"] },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: "Cairo", sans-serif; background: radial-gradient(circle at top, #145a3c 0%, #0b3d2e 100%); color: #fdf6e3; min-height: 100vh; }
      .stars-bg::before { content: ""; position: fixed; inset: 0; background-image: radial-gradient(2px 2px at 20% 30%, #f4c430 40%, transparent 50%), radial-gradient(1px 1px at 70% 80%, #f4c430 40%, transparent 50%), radial-gradient(1.5px 1.5px at 40% 60%, #fff8dc 40%, transparent 50%), radial-gradient(1px 1px at 85% 20%, #f4c430 40%, transparent 50%), radial-gradient(1px 1px at 10% 75%, #fff8dc 40%, transparent 50%); opacity: 0.4; pointer-events: none; z-index: 0; }
      .card-gold { border: 1px solid rgba(244, 196, 48, 0.4); box-shadow: 0 4px 20px rgba(244, 196, 48, 0.08); }
      .btn-gold { background: linear-gradient(135deg, #f4c430, #d4a017); color: #0b3d2e; font-weight: 700; transition: all 0.25s; }
      .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244, 196, 48, 0.4); }
      .juz-card { transition: all 0.25s ease; cursor: pointer; }
      .juz-card:hover:not(.reserved) { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 30px rgba(244, 196, 48, 0.35); }
      .juz-card.reserved { background: rgba(60, 60, 60, 0.5); cursor: not-allowed; opacity: 0.6; }
      #root { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- سيتم استبدال هذا المحتوى بواسطة React -->
      <div style="text-align: center;">
        <div style="font-size: 50px;">🌙</div>
        <h2>جارٍ التحميل...</h2>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, collection, doc, setDoc, getDocs, query, where, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // 🔑 ضع مفاتيح Firebase الخاصة بك هنا
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };

      const app = initializeApp(firebaseConfig);
      window.auth = getAuth(app);
      window.db = getFirestore(app);
      window.googleProvider = new GoogleAuthProvider();
      window.fbFuncs = { signInWithPopup, signOut, onAuthStateChanged, collection, doc, setDoc, getDocs, query, where, serverTimestamp, deleteDoc };
      
      // إعلام React بأن Firebase جاهز
      window.dispatchEvent(new Event("firebase-ready"));
    </script>

    <!-- React App -->
    <script type="text/babel" data-presets="react">
      const { useState, useEffect } = React;

      const juzData = Array.from({ length: 30 }, (_, i) => ({ number: i + 1, name: `الجزء ${i + 1}` }));
      const duas = [
        { title: "دعاء ختم القرآن", text: "اللَّهُمَّ ارْحَمْنِي بِالْقُرْآنِ، وَاجْعَلْهُ لِي إِمَامًا وَنُورًا وَهُدًى وَرَحْمَةً..." },
        { title: "دعاء قبل التلاوة", text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ أَنْ تَرْحَمَنِي..." },
        { title: "دعاء حفظ القرآن", text: "اللَّهُمَّ اجْعَلِ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي." },
        { title: "دعاء البركة في الوقت", text: "اللَّهُمَّ بَارِكْ لِي فِي وَقْتِي، وَأَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ." }
      ];

      function Login({ onLogin }) {
        return (
          <div className="stars-bg min-h-screen flex items-center justify-center px-4 w-full">
            <div className="card-gold bg-deen-dark/80 backdrop-blur-md rounded-3xl p-10 max-w-md w-full text-center relative z-10">
              <div className="text-6xl mb-4">🌙</div>
              <h1 className="text-3xl font-bold text-deen-gold mb-2 font-arabic">أوراد القرآن الكريم</h1>
              <p className="text-deen-cream/80 mb-8">احجز وردك اليومي وشارك ختم القرآن</p>
              <button onClick={onLogin} className="btn-gold w-full py-3 rounded-xl flex items-center justify-center gap-3 text-lg">
                <span className="text-2xl">🔐</span> تسجيل الدخول عبر Google
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [reservations, setReservations] = useState({});
        const [userCity, setUserCity] = useState("غير محدد");
        const [fbReady, setFbReady] = useState(false);
        const todayKey = new Date().toISOString().split("T")[0];

        useEffect(() => {
          if (window.auth) setFbReady(true);
          else window.addEventListener("firebase-ready", () => setFbReady(true));
        }, []);

        useEffect(() => {
          if (!fbReady) return;
          const unsub = window.fbFuncs.onAuthStateChanged(window.auth, (u) => {
            setUser(u);
            setLoading(false);
          });
          return () => unsub();
        }, [fbReady]);

        const loadReservations = async () => {
          const q = window.fbFuncs.query(window.fbFuncs.collection(window.db, "reservations"), window.fbFuncs.where("date", "==", todayKey));
          const snap = await window.fbFuncs.getDocs(q);
          const map = {};
          snap.forEach((d) => { map[d.data().juzNumber] = d.data(); });
          setReservations(map);
        };

        useEffect(() => { if (user && fbReady) loadReservations(); }, [user, fbReady]);

        const handleLogin = async () => {
          try { await window.fbFuncs.signInWithPopup(window.auth, window.googleProvider); } 
          catch (err) { alert("فشل تسجيل الدخول: " + err.message); }
        };

        const handleLogout = () => window.fbFuncs.signOut(window.auth);

        const handleReserve = async (juzNumber) => {
          if (!user) return alert("سجل الدخول أولاً");
          if (reservations[juzNumber]) return alert("هذا الورد محجوز بالفعل!");
          
          const docId = `${todayKey}_${juzNumber}`;
          try {
            await window.fbFuncs.setDoc(window.fbFuncs.doc(window.db, "reservations", docId), {
              juzNumber, date: todayKey, userId: user.uid, userName: user.displayName || "مستخدم", city: userCity, createdAt: window.fbFuncs.serverTimestamp()
            });
            await loadReservations();
            alert(`✅ تم حجز الجزء ${juzNumber}`);
          } catch (err) { alert("خطأ: " + err.message); }
        };

        if (!fbReady || loading) return <div className="text-deen-gold text-2xl min-h-screen flex items-center justify-center">جارٍ التحميل...</div>;
        if (!user) return <Login onLogin={handleLogin} />;

        return (
          <div className="stars-bg min-h-screen relative w-full">
            <div className="relative z-10 container mx-auto px-4 py-6 max-w-6xl">
              <header className="flex justify-between items-center py-4 border-b border-deen-gold/30">
                <h1 className="text-xl font-bold text-deen-gold font-arabic">🕌 أوراد القرآن</h1>
                <div className="flex items-center gap-3">
                  <img src={user.photoURL} className="w-10 h-10 rounded-full border-2 border-deen-gold" />
                  <button onClick={handleLogout} className="px-3 py-1 text-sm border border-deen-gold/50 rounded-lg hover:bg-deen-gold hover:text-deen-dark">خروج</button>
                </div>
              </header>

              <div className="my-8">
                <h2 className="text-2xl font-bold text-deen-gold mb-4 font-arabic">📖 الأوراد (30 جزءاً)</h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                  {juzData.map((juz) => {
                    const res = reservations[juz.number];
                    const mine = res && res.userId === user.uid;
                    return (
                      <div key={juz.number} onClick={() => !res && handleReserve(juz.number)} className={`juz-card card-gold rounded-xl p-3 text-center ${res ? "reserved" : "bg-deen-green/60"}`}>
                        <p className="text-2xl mb-1">{res ? "🔒" : "📗"}</p>
                        <p className="text-sm font-bold text-deen-gold">{juz.name}</p>
                        {res ? <p className="text-[10px] mt-2 text-red-300">{mine ? "حجزك ✓" : "محجوز"}</p> : <p className="text-[10px] mt-2 text-green-300">متاح ✓</p>}
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="my-10">
                <h2 className="text-2xl font-bold text-deen-gold mb-4 font-arabic">🤲 أدعية مختارة</h2>
                <div className="grid md:grid-cols-2 gap-4">
                  {duas.map((d, i) => (
                    <div key={i} className="card-gold bg-deen-dark/60 p-5 rounded-2xl">
                      <h3 className="text-deen-gold font-bold mb-2 font-arabic">{d.title}</h3>
                      <p className="text-deen-cream/90 leading-loose text-sm font-arabic">{d.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
